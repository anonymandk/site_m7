<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento — M7 Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style id="m7-blue-theme">
:root{
  --v:#0d7cff !important; --v2:#0064ea !important; --v3:#36a7ff !important;
  --v4:#0756b8 !important; --v5:#a8dcff !important;
  --glow:0 0 30px rgba(13,124,255,.42),0 0 60px rgba(13,124,255,.18) !important;
  --glow2:0 0 15px rgba(13,124,255,.62),0 0 30px rgba(13,124,255,.28) !important;
}
#loading{
  position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,rgba(0,102,255,.18),transparent 38%),#030811;
  transition:opacity .65s ease, visibility .65s ease;
}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loading .load-logo{font-family:'Space Grotesk',sans-serif;font-size:clamp(4rem,10vw,7rem);font-weight:700;letter-spacing:-.08em;line-height:1;
  background:linear-gradient(135deg,#fff 20%,#0d7cff 55%,#36a7ff 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(13,124,255,.48));margin-bottom:2rem}
#loading .load-bar-wrap{width:min(360px,72vw);height:3px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;border:1px solid rgba(54,167,255,.16)}
#loading .load-bar{height:100%;width:0;background:linear-gradient(90deg,#0064ea,#36a7ff);box-shadow:0 0 16px rgba(54,167,255,.65);animation:m7Loading 2s cubic-bezier(.2,.8,.2,1) forwards}
#loading .load-text{margin-top:1rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.22em;color:#8ebcff}
#loading .load-sub{margin-top:.45rem;font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.14em;color:#50657f}
@keyframes m7Loading{0%{width:0}35%{width:48%}70%{width:76%}100%{width:100%}}
.m7-page-card{border-color:rgba(13,124,255,.18)!important;box-shadow:0 18px 55px rgba(0,55,140,.14)}
</style>


<style id="m7-header-style">
.m7-site-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  height:84px;
  display:flex;
  align-items:center;
  background:rgba(3,8,17,.94);
  border-bottom:1px solid rgba(48,139,255,.12);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.m7-site-header .m7-header-inner{
  width:min(1420px,calc(100% - 64px));
  height:100%;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
}
.m7-site-header .m7-brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:#f2f7ff;
  text-decoration:none;
  white-space:nowrap;
}
.m7-site-header .m7-logo-mark{
  font-family:"Space Grotesk",Arial,sans-serif;
  font-size:35px;
  font-weight:700;
  font-style:italic;
  letter-spacing:-5px;
  line-height:1;
  color:#0d7cff;
  text-shadow:0 0 18px rgba(13,124,255,.28);
}
.m7-site-header .m7-logo-word{
  font-family:"Space Grotesk",Arial,sans-serif;
  font-size:24px;
  font-weight:700;
  letter-spacing:.9px;
  line-height:1;
  color:#eef5ff;
}
.m7-site-header .m7-nav{
  display:flex;
  align-items:center;
  gap:26px;
}
.m7-site-header .m7-nav a{
  color:#a8b7c9;
  text-decoration:none;
  font:600 13px/1 "Inter",Arial,sans-serif;
  transition:.2s ease;
}
.m7-site-header .m7-nav a:hover{
  color:#36a7ff;
}
.m7-site-header .m7-account{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:94px;
  padding:10px 15px;
  border-radius:7px;
  color:#fff !important;
  background:linear-gradient(135deg,#0d7cff,#0064ea);
  box-shadow:0 8px 24px rgba(13,124,255,.22);
}
.m7-site-header .m7-menu{
  display:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}
@media(max-width:900px){
  .m7-site-header{height:72px}
  .m7-site-header .m7-header-inner{width:min(100% - 30px,720px)}
  .m7-site-header .m7-nav{display:none}
  .m7-site-header .m7-account{display:none}
  .m7-site-header .m7-menu{display:block}
}
</style>

  <link rel="stylesheet" href="m7-community.css">
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
    <div class="load-logo">M7</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-text">INICIALIZANDO SISTEMA...</div><div class="load-sub">CARREGANDO PLATAFORMA M7</div>
</div>

<!-- Custom Cursor -->
<div id="cursor"></div>
<div id="cursor-trail"></div>

<!-- HEADER -->
<div id="header-placeholder"></div>
<script>
fetch("header.html")
  .then(response => response.text())
  .then(data => { document.getElementById("header-placeholder").innerHTML = data; })
  .catch(() => {});
</script>

<main style="padding-top:84px;" class="section">
    <div class="section-header fade-up">
        <div class="section-tag">// CHECKOUT</div>
        <h2 class="section-title">Ativar <span style="background:linear-gradient(135deg,var(--v3),var(--v5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Licença</span></h2>
        <p class="section-sub">Ativação segura da sua licença M7</p>
    </div>

    <div class="main-content fade-up" style="max-width: 600px; margin: 0 auto;">
        <div style="background: var(--glass); border: 1px solid var(--glassborder); padding: 3rem; border-radius: 24px; backdrop-filter: blur(12px); text-align: center;">
            <div style="margin-bottom: 2rem; display: flex; justify-content: center; gap: 1rem;">
                <div style="padding: 1rem; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glassborder); cursor: pointer; transition: 0.3s; width: 120px;" class="pay-method active" onclick="selectMethod(this)">
                    <div style="font-weight: 800; color: var(--w); font-size: 0.9rem;">PIX</div>
                    <div style="font-size: 0.7rem; color: var(--g3);">Instantâneo</div>
                </div>
                <div style="padding: 1rem; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glassborder); cursor: pointer; transition: 0.3s; width: 120px;" class="pay-method" onclick="selectMethod(this)">
                    <div style="font-weight: 800; color: var(--w); font-size: 0.9rem;">CARD</div>
                    <div style="font-size: 0.7rem; color: var(--g3);">Até 12x</div>
                </div>
            </div>

            <div id="payment-detail" style="margin-bottom: 2rem; padding: 2rem; background: rgba(0,0,0,0.2); border-radius: 15px; border: 1px dashed var(--v3); color: var(--g2); font-family: var(--font-mono); font-size: 0.9rem;">
                Aguardando seleção de método...
            </div>

            <a href="cart.html" class="btn-secondary" style="text-decoration: none; margin-right: 1rem;">Voltar às Licenças</a>
            <button class="btn-primary" onclick="processPayment()">Confirmar Ativação</button>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script>
fetch("footer.html")
  .then(response => response.text())
  .then(data => { document.getElementById("footer-placeholder").innerHTML = data; })
  .catch(() => {});
</script>
<script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const cursorTrail = document.getElementById('cursor-trail');
    let mx=0,my=0,tx=0,ty=0;
    document.addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = (mx-6) + 'px';
        cursor.style.top = (my-6) + 'px';
    });
    function animateCursor() {
        tx += (mx - tx) * 0.12;
        ty += (my - ty) * 0.12;
        cursorTrail.style.left = (tx-16) + 'px';
        cursorTrail.style.top = (ty-16) + 'px';
        requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('button,a,.product-card,.carousel-btn').forEach(el => {
        el.addEventListener('mouseenter', () => { cursor.style.transform = 'scale(2.5)'; cursor.style.opacity = '.6'; });
        el.addEventListener('mouseleave', () => { cursor.style.transform = 'scale(1)'; cursor.style.opacity = '1'; });
    });
    // Loading
    (() => {
        const loading = document.getElementById('loading');
        if (!loading) return;
        const started = performance.now();
        const finish = () => {
            const elapsed = performance.now() - started;
            setTimeout(() => loading.classList.add('hidden'), Math.max(350, 1800 - elapsed));
        };
        if (document.readyState === 'complete') finish();
        else window.addEventListener('load', finish, { once: true });
    })();

    // Header Scroll
    window.addEventListener('scroll', () => {
        document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 40);
    });

    // Animations
    function initAnimations() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e, i) => {
                if(e.isIntersecting) {
                    setTimeout(() => e.target.classList.add('visible'), i * 80);
                }
            });
        }, {threshold:0.1, rootMargin:'0px 0px -50px 0px'});
        document.querySelectorAll('.fade-up,.fade-in').forEach(el => observer.observe(el));
    }
    initAnimations();

    function selectMethod(el) {
        document.querySelectorAll('.pay-method').forEach(m => {
            m.style.borderColor = 'var(--glassborder)';
            m.style.background = 'rgba(255,255,255,0.05)';
            m.style.boxShadow = 'none';
        });
        el.style.borderColor = 'var(--v3)';
        el.style.background = 'rgba(13,124,255,0.1)';
        el.style.boxShadow = '0 0 15px var(--v3)';

        const detail = document.getElementById('payment-detail');
        if(el.textContent.includes('PIX')) {
            detail.innerHTML = 'Preparando instruções de pagamento via PIX...';
        } else {
            detail.innerHTML = 'Aguardando os dados do cartão...';
        }
    }

    function processPayment() {
        alert('Ativação processada. Redirecionando para sua conta M7...');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
