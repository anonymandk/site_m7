<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento — M7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="m7-community.css">
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
    <div class="load-logo">M7</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-text">INICIALIZANDO SISTEMA...</div>
</div>

<!-- Custom Cursor -->
<div id="cursor"></div>
<div id="cursor-trail"></div>

<!-- HEADER -->
<div id="header-placeholder"></div>
<script>
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
    });
</script>

<main class="section">
    <div class="section-header fade-up">
        <div class="section-tag">// CHECKOUT</div>
        <h2 class="section-title">Finalizar <span style="background:linear-gradient(135deg,var(--v3),var(--v5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Pagamento</span></h2>
        <p class="section-sub">Segurança de nível militar para sua transação</p>
    </div>

    <div class="main-content fade-up" style="max-width: 600px; margin: 0 auto;">
        <div style="background: var(--glass); border: 1px solid var(--glassborder); padding: 3rem; border-radius: 24px; backdrop-filter: blur(12px); text-align: center;">
            <div style="margin-bottom: 2rem; display: flex; justify-content: center; gap: 1rem;">
                <div style="padding: 1rem; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glassborder); cursor: pointer; transition: 0.3s; width: 120px;" class="pay-method active" onclick="selectMethod(this)">
                    <div style="font-weight: 800; color: var(--w); font-size: 0.9rem;">PIX</div>
                    <div style="font-size: 0.7rem; color: var(--g3);">Instantâneo</div>
                </div>
                <div style="padding: 1rem; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glassborder); cursor: pointer; transition: 0.3s; width: 120px;" class="pay-method" onclick="selectMethod(this)">
                    <div style="font-weight: 800; color: var(--w); font-size: 0.9rem;">CARD</div>
                    <div style="font-size: 0.7rem; color: var(--g3);">Até 12x</div>
                </div>
            </div>

            <div id="payment-detail" style="margin-bottom: 2rem; padding: 2rem; background: rgba(0,0,0,0.2); border-radius: 15px; border: 1px dashed var(--v3); color: var(--g2); font-family: var(--font-mono); font-size: 0.9rem;">
                Aguardando seleção de método...
            </div>

            <a href="cart.html" class="btn-secondary" style="text-decoration: none; margin-right: 1rem;">Voltar ao Carrinho</a>
            <button class="btn-primary" onclick="processPayment()">Confirmar Pagamento</button>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script>
fetch("footer.html")
  .then(response => response.text())
  .then(data => { document.getElementById("footer-placeholder").innerHTML = data; })
  .catch(() => {});
</script>
<script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const cursorTrail = document.getElementById('cursor-trail');
    let mx=0,my=0,tx=0,ty=0;
    document.addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = (mx-6) + 'px';
        cursor.style.top = (my-6) + 'px';
    });
    function animateCursor() {
        tx += (mx - tx) * 0.12;
        ty += (my - ty) * 0.12;
        cursorTrail.style.left = (tx-16) + 'px';
        cursorTrail.style.top = (ty-16) + 'px';
        requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('button,a,.product-card,.carousel-btn').forEach(el => {
        el.addEventListener('mouseenter', () => { cursor.style.transform = 'scale(2.5)'; cursor.style.opacity = '.6'; });
        el.addEventListener('mouseleave', () => { cursor.style.transform = 'scale(1)'; cursor.style.opacity = '1'; });
    });

    // Loading
    window.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        if(loading) {
            loading.classList.add('hidden');
            loading.style.opacity = '0';
            loading.style.visibility = 'hidden';
            loading.style.pointerEvents = 'none';
        }
    });

    // Header Scroll
    window.addEventListener('scroll', () => {
        document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 40);
    });

    // Animations
    function initAnimations() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e, i) => {
                if(e.isIntersecting) {
                    setTimeout(() => e.target.classList.add('visible'), i * 80);
                }
            });
        }, {threshold:0.1, rootMargin:'0px 0px -50px 0px'});
        document.querySelectorAll('.fade-up,.fade-in').forEach(el => observer.observe(el));
    }
    initAnimations();

    function selectMethod(el) {
        document.querySelectorAll('.pay-method').forEach(m => {
            m.style.borderColor = 'var(--glassborder)';
            m.style.background = 'rgba(255,255,255,0.05)';
            m.style.boxShadow = 'none';
        });
        el.style.borderColor = 'var(--v3)';
        el.style.background = 'rgba(139,92,246,0.1)';
        el.style.boxShadow = '0 0 15px var(--v3)';

        const detail = document.getElementById('payment-detail');
        if(el.textContent.includes('PIX')) {
            detail.innerHTML = 'Gerando QR Code via API de Pagamentos...';
        } else {
            detail.innerHTML = 'Aguardando dados do cartão de crédito...';
        }
    }

    function processPayment() {
        alert('Integração de pagamento em processamento. Redirecionando para a confirmação do pedido...');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
